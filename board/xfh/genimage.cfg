image boot.vfat {
    vfat {
        files = {
            "zImage",
            "suniv-f1c100s-licheepi-nano.dtb",
            "boot.scr"
        }
    }
    size = 64M
}

image sdcard.img {
    hdimage {
        partition-table-type = "mbr"
    }
    partition uboot {
        in-partition-table = false
        image = "u-boot-sunxi-with-spl.bin"
        offset = 8K
    }
    partition boot {
        partition-type = 0x0c
        image = "boot.vfat"
        offset = 1M
    }
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}
